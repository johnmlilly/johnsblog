media:
  input: public/assets
  output: /assets

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    filename: "{primary}.md"
    view:
      fields: [ title, published, featured, date ]
    fields:
      - { label: "Published", name: "published", type: "boolean", default: false }
      - { label: "Title", name: "title", type: "string" }
      - { label: "Short Description", name: "description", type: "text" }
      - { label: "Logo (optional Simple Icons slug, e.g. react)", name: "logo", type: "string" }
      - { label: "Date", name: "date", type: "date" }
      - { label: "Featured", name: "featured", type: "boolean", default: false }
      - name: tags
        label: Tag
        type: select
        options:
          creatable: true
          multiple: true
          values: [ Front-end Development, JavaScript, CSS, C#, Career, SEO, Accessibility, Terminal ]
      - { label: "Body", name: "body", type: "rich-text" }
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view: 
      fields: [title, featured, date]
    fields:
      - { label: "Project Name", name: "title", type: "string" }
      - { label: "Short Description", name: "description", type: "text" }
      - { label: "Project Image (optional)", name: "image", type: "image", required: false }
      - { label: "Project Date", name: "date", type: "date" }
      - { label: "Featured", name: "featured", type: "boolean", default: false }
      - name: tags
        label: Tags
        type: select
        options:
          creatable: true
          multiple: true
          values: [ JavaScript, Custom CSS, Webflow, WordPress, UX/UI, Responsive Design, SQL, Bootstrap, Tailwind ]
      - { label: "Project Link (optional)", name: "link", type: "string" }
      - { label: "Logo (optional Simple Icons slug, e.g. react)", name: "logo", type: "string" }
      - { label: "Role (optional, e.g. design + build)", name: "role", type: "string" }
      - { label: "Status (optional, e.g. live)", name: "status", type: "string" }
      - { label: "Repo (optional, URL or 'private')", name: "repo", type: "string" }
      - { label: "Case Study", name: "body", type: "rich-text" }
  - name: skills
    label: Skills
    type: collection
    path: src/content/skills
    filename: "{primary}.md"
    view:
        fields: [title, order]
    fields:
      - { label: "Skill Name", name: "title", type: "string" }
      - { label: "Order", name: "order", type: "number" }
      - { label: "Skills", name: "skills", type: "string", list: true }
  - name: index_meta
    label: Home Page SEO
    path: src/data/pages/home.json
    type: file
    fields:
      - { label: "Page Title", name: "title", type: "string" }
      - { label: "Meta Description", name: "description", type: "text" }
      - { label: "Social Image", name: "image", type: "image" }
  - name: contact_meta
    label: Contact Page SEO
    path: src/data/pages/contact.json
    type: file
    fields:
      - { label: "Page Title", name: "title", type: "string" }
      - { label: "Meta Description", name: "description", type: "text" }
  - name: blog_meta
    label: Blog Page SEO
    path: src/data/pages/blog.json
    type: file
    fields:
      - { label: "Page Title", name: "title", type: "string" }
      - { label: "Meta Description", name: "description", type: "text" }
  - name: project_meta
    label: Project Page SEO
    path: src/data/pages/projects.json
    type: file
    fields:
      - { label: "Page Title", name: "title", type: "string" }
      - { label: "Meta Description", name: "description", type: "text" }

  - name: home
    label: Home Page
    path: src/data/home.json
    type: file
    fields:

    # HERO SECTION
    - name: hero
      label: Hero Section
      type: object
      fields:
        - label: "Name"
          name: "name"
          type: "string"
        - label: "Greeting"
          name: "greeting"
          type: "string"
        - label: "Description"
          name: "description"
          type: "text"
        - label: "First CTA Text"
          name: "firstCtaText"
          type: "string"
        - label: "First CTA URL"
          name: "firstCtaUrl"
          type: "string"
        - label: "Second CTA Text"
          name: "secondCtaText"
          type: "string"
        - label: "Second CTA URL"
          name: "secondCtaUrl"
          type: "string"
        - label: "Image"
          name: "image"
          type: "image"

    # ABOUT SECTION
    - name: about
      label: About Section
      type: object
      fields:
        - label: "Heading"
          name: "heading"
          type: "string"
        - label: "Description"
          name: "description"
          type: "string"
          list: true
        - label: "Image"
          name: "image"
          type: "image"
        - label: "CTA Text"
          name: "ctaText"
          type: "string"
        - label: "CTA URL"
          name: "ctaUrl"
          type: "string"

    # SERVICES SECTION
    - name: services
      label: Services Section
      type: object
      fields:
        - label: "Title"
          name: "title"
          type: "string"
        - label: "Subtitle"
          name: "subtitle"
          type: "string"
        - label: "Service Cards"
          name: "cards"
          type: object
          list: true
          collapsible:
            collapsed: true # Default collapsed state
            summary: "{Title} ({index})" # Template string using field values and {index}
          fields:
            - label: "Icon (Lucide name)"
              name: "icon"
              type: "string"
            - label: "Title"
              name: "title"
              type: "string"
            - label: "Description"
              name: "description"
              type: "text"
 
settings:
      content:
        merge: true