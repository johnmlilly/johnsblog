media:
  input: public/assets
  output: /assets

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    filename: "{primary}.md"
    view:
      fields: [ title, published, featured, date ]
    fields:
      - { label: "Published", name: "published", type: "boolean", default: false }
      - { label: "Title", name: "title", type: "string" }
      - { label: "Short Description", name: "description", type: "text" }
      - { label: "Logo (optional Simple Icons slug, e.g. react)", name: "logo", type: "string" }
      - { label: "Date", name: "date", type: "date" }
      - { label: "Featured", name: "featured", type: "boolean", default: false }
      - name: tags
        label: Tag
        type: select
        options:
          creatable: true
          multiple: true
          values: [ Front-end Development, JavaScript, CSS, C#, Career, SEO, Accessibility, Terminal ]
      - { label: "Body", name: "body", type: "rich-text" }
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view: 
      fields: [title, featured, date]
    fields:
      - { label: "Project Name", name: "title", type: "string" }
      - { label: "Short Description", name: "description", type: "text" }
      - { label: "Project Image (optional)", name: "image", type: "image", required: false }
      - { label: "Project Date", name: "date", type: "date" }
      - { label: "Featured", name: "featured", type: "boolean", default: false }
      - name: tags
        label: Tags
        type: select
        options:
          creatable: true
          multiple: true
          values: [ JavaScript, Custom CSS, Webflow, WordPress, UX/UI, Responsive Design, SQL, Bootstrap, Tailwind ]
      - { label: "Project Link (optional)", name: "link", type: "string" }
      - { label: "Logo (optional Simple Icons slug, e.g. react)", name: "logo", type: "string" }
      - { label: "Role (optional, e.g. design + build)", name: "role", type: "string" }
      - { label: "Status (optional, e.g. live)", name: "status", type: "string" }
      - { label: "Repo (optional, URL or 'private')", name: "repo", type: "string" }
      - { label: "Case Study", name: "body", type: "rich-text" }
  - name: index_meta
    label: Home Page SEO
    path: src/data/pages/home.json
    type: file
    fields:
      - { label: "Page Title", name: "title", type: "string" }
      - { label: "Meta Description", name: "description", type: "text" }
      - { label: "Social Image", name: "image", type: "image" }
  - name: contact_meta
    label: Contact Page SEO
    path: src/data/pages/contact.json
    type: file
    fields:
      - { label: "Page Title", name: "title", type: "string" }
      - { label: "Meta Description", name: "description", type: "text" }
  - name: blog_meta
    label: Blog Page SEO
    path: src/data/pages/blog.json
    type: file
    fields:
      - { label: "Page Title", name: "title", type: "string" }
      - { label: "Meta Description", name: "description", type: "text" }
  - name: project_meta
    label: Project Page SEO
    path: src/data/pages/projects.json
    type: file
    fields:
      - { label: "Page Title", name: "title", type: "string" }
      - { label: "Meta Description", name: "description", type: "text" }

  - name: home
    label: Home Page
    path: src/data/home.json
    type: file
    fields:

    # HERO SECTION
    - name: hero
      label: Hero Section
      type: object
      fields:
        - label: "Name"
          name: "name"
          type: "string"
        - label: "Greeting"
          name: "greeting"
          type: "string"
        - label: "Roles (typed in order after \"I'm a\")"
          name: "roles"
          type: "string"
          list: true
        - label: "First CTA Text"
          name: "firstCtaText"
          type: "string"
        - label: "First CTA URL"
          name: "firstCtaUrl"
          type: "string"
        - label: "Second CTA Text"
          name: "secondCtaText"
          type: "string"
        - label: "Second CTA URL"
          name: "secondCtaUrl"
          type: "string"
        - label: "Image"
          name: "image"
          type: "image"

    # ABOUT SECTION
    - name: about
      label: About Section
      type: object
      fields:
        - label: "Heading"
          name: "heading"
          type: "string"
        - label: "Description"
          name: "description"
          type: "string"
          list: true
        - label: "Image"
          name: "image"
          type: "image"
        - label: "CTA Text"
          name: "ctaText"
          type: "string"
        - label: "CTA URL"
          name: "ctaUrl"
          type: "string"

    # HISTORY SECTION
    - name: history
      label: History
      type: object
      list: true
      collapsible:
        collapsed: true
        summary: "{when}: {title}"
      fields:
        - label: "When (e.g. summer 2021)"
          name: "when"
          type: "string"
        - label: "Title"
          name: "title"
          type: "string"
        - label: "Detail"
          name: "detail"
          type: "text"
        - label: "Link (optional, e.g. /projects/fiatgardens/)"
          name: "link"
          type: "string"

    # CONTACT SECTION
    - name: contact
      label: Contact Section
      type: object
      fields:
        - label: "Heading"
          name: "heading"
          type: "string"
        - label: "Description"
          name: "description"
          type: "text"
        - label: "Button Text"
          name: "cta"
          type: "string"

settings:
      content:
        merge: true