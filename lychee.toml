# Link checker config for .github/workflows/links.yml

max_retries = 3
timeout = 20
accept = ["200..=299", "429"]
exclude_all_private = true

exclude = [
  # Sites that block automated requests.
  '^https://(www\.)?linkedin\.com',
  '^https://(www\.)?(twitter|x)\.com',
  '^https://(www\.)?instagram\.com',
  '^https://(www\.)?facebook\.com',
]
